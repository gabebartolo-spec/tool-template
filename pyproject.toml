[project]
name = "new-tool"
version = "0.0.1"
description = "New tool (rename at kickoff)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: needs a local Blender 5.2 (headless); skipped in CI",
    "gpu: needs the local GPU and a generator; skipped in CI",
]
addopts = "-m 'not blender and not gpu'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
